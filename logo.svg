<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="خزينتي" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".9" r=".7">
      <stop offset="0" stop-color="#10B981" stop-opacity=".55"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".05" r=".6">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".6"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow2)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- back shield layer (depth) -->
    <path transform="translate(0 16)" fill="url(#back)" opacity=".9" filter="url(#soft)"
      d="M256 84C340 84 396 120 396 190V290C396 360 340 410 256 436C172 410 116 360 116 290V190C116 120 172 84 256 84Z"/>
    <!-- glass shield -->
    <path fill="url(#glass)" stroke="url(#rim)" stroke-width="3"
      d="M256 84C340 84 396 120 396 190V290C396 360 340 410 256 436C172 410 116 360 116 290V190C116 120 172 84 256 84Z"/>
    <!-- خ : bowl + rising ribbon -->
    <path d="M304 224C266 228 228 238 200 256C166 278 176 330 238 330C298 330 342 300 374 230"
      fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dot of خ = coin -->
    <circle cx="268" cy="166" r="21" fill="#34D399" filter="url(#neon)"/>
  </g>
</svg>
